name: Release

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish VSIX
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read release metadata
        id: meta
        shell: bash
        run: |
          BASE_VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          MAJOR_MINOR="$(node -e "const version = require('./package.json').version.split('.'); console.log(version[0] + '.' + version[1])")"
          RELEASE_VERSION="${MAJOR_MINOR}.${GITHUB_RUN_NUMBER}"
          TAG="v${RELEASE_VERSION}"

          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "vsix=outputs/$NAME-$RELEASE_VERSION.vsix" >> "$GITHUB_OUTPUT"
          echo "source=outputs/$NAME-source-$RELEASE_VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Set auto-increment release version
        run: npm version --no-git-tag-version "${{ steps.meta.outputs.version }}"

      - name: Check sources
        run: npm run check

      - name: Build VSIX
        run: npm run build

      - name: Build source archive
        shell: bash
        run: |
          mkdir -p outputs
          git ls-files -z | xargs -0 zip -X "${{ steps.meta.outputs.source }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: OBS Service Workflow ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            ${{ steps.meta.outputs.vsix }}
            ${{ steps.meta.outputs.source }}
